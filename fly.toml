# fly.toml app configuration file generated for resume-tailor-5kjn-w on 2026-10-30T07:31:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'resume-tailor-5kjn-w'
primary_region = 'ams'
kill_timeout = '1m5s'

[build]

[deploy]
  strategy = 'bluegreen'

[env]
  COMPILE_CONCURRENCY = '2'
  COMPILE_ROOT = '/var/lib/compile'
  EMAIL_TRANSPORT = 'resend'
  HOSTNAME = '0.0.0.0'
  LATEX_RUN_AS = 'tex'
  PORT = '3000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
