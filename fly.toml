app = "resume-tailor"
primary_region = "lhr"

[build]

[env]
  PORT = "3000"
  # Also set in the image; repeated so the server listens on all interfaces whatever the platform sets.
  HOSTNAME = "0.0.0.0"
  COMPILE_CONCURRENCY = "2"
  EMAIL_TRANSPORT = "resend"
  LATEX_RUN_AS = "tex"
  COMPILE_ROOT = "/var/lib/compile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Shallow on purpose: a database query every 30 s would keep a scale-to-zero Neon database awake.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
